# Deploy the site to Cloudflare Workers static assets on every push to main.
#
# Runs wrangler directly rather than via cloudflare/wrangler-action. The action installs its own
# wrangler (still 3.90.0 by default, which cannot deploy an assets-only Worker — it fails with
# "Missing entry-point" because wrangler.jsonc has no `main`), and pinning its `wranglerVersion`
# then failed on the runner with "npx canceled due to missing packages and no YES option".
# `npm ci` + `npx wrangler` uses the exact version pinned in package-lock.json, which is the same
# one verified locally, and passes the token the way wrangler documents.
#
# Requires one repository secret:
#   CLOUDFLARE_API_TOKEN  — Cloudflare dashboard → My Profile → API Tokens →
#                           Create Token → "Edit Cloudflare Workers" template.
#                           It must be the secret's VALUE, with the secret NAMED
#                           CLOUDFLARE_API_TOKEN.
# Add CLOUDFLARE_ACCOUNT_ID as a second secret (and uncomment it below) only if the token can see
# more than one Cloudflare account, in which case the deploy fails asking you to disambiguate.
#
# To deploy only when the site actually changes, add a paths filter under `push:`
# (e.g. app/**, wrangler.jsonc, package.json). Left off deliberately: every push to main
# deploying is easier to reason about than wondering why a deploy didn't happen.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:        # manual runs from the Actions tab

permissions:
  contents: read

concurrency:                # never let two deploys race; newest push wins
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Stamp the page with the commit it was built from, so the `build` string in the UI
      # identifies the exact source and a stale cached copy is obvious at a glance. The working
      # copy says 'dev'; only the deployed artifact carries a SHA. Nothing is committed back.
      - name: Stamp build with commit SHA
        run: |
          # Fail loudly rather than silently shipping an unstamped page if the line is renamed.
          grep -q "^const BUILD = " app/index.html
          sed -i "s|^const BUILD = .*|const BUILD = '${GITHUB_SHA:0:7}';|" app/index.html
          grep -n "^const BUILD = " app/index.html

      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
