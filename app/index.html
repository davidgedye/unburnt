<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Wildfires of the West</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.js"></script>
  <link href="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.css" rel="stylesheet">
  <style>
    :root { --panel: rgba(16,20,27,.86); --ink: #c3ccd6; --dim: #7a8794; --hot: #ff7a1a; }
    html, body, #map { margin: 0; height: 100%; background: #0a0d12; }
    #map { position: absolute; inset: 0; }
    .panel {
      position: absolute; z-index: 2; background: var(--panel);
      color: var(--ink); border: 1px solid rgba(255,255,255,.08);
      border-radius: 10px; font: 13px/1.5 system-ui, sans-serif;
      backdrop-filter: blur(8px); box-shadow: 0 4px 20px rgba(0,0,0,.5);
    }
    /* Title (top-left) */
    #title { top: 12px; left: 12px; padding: 10px 14px; max-width: 300px; }
    #title b { color: #fff; font-size: 15px; }
    #title span { color: var(--dim); font-size: 12px; }
    /* Year scrubber — an invisible full-height rail down the right edge. There is no track:
       the only thing drawn is the handle, a lozenge carrying the year it is parked on. Grabbing
       anywhere in the rail jumps to that year, so it reads as "drag me up and down". Custom
       pointer handling rather than <input type=range>: vertical ranges still need two different
       vendor mechanisms and disagree on which end is the minimum, and the track cannot be
       reliably hidden — driving it directly is both shorter and predictable everywhere. */
    #rail {
      position: absolute; top: 0; right: 0; bottom: 0; width: 56px; z-index: 3;
      touch-action: none;                  /* a vertical drag scrubs; it must not scroll or pan */
      cursor: grab; -webkit-tap-highlight-color: transparent;
    }
    #rail:active { cursor: grabbing; }
    #rail:focus { outline: none; }
    #rail:focus-visible #year { box-shadow: 0 0 0 2px #fff, 0 4px 14px rgba(0,0,0,.55); }
    #year {
      position: absolute; right: 12px; bottom: 0; transform: translateY(50%);
      background: var(--hot); color: #150a02; padding: 9px 13px; border-radius: 999px;
      font: 700 15px/1 ui-monospace, monospace; font-variant-numeric: tabular-nums;
      letter-spacing: .02em; pointer-events: none;   /* the rail owns every pointer event */
      box-shadow: 0 4px 14px rgba(0,0,0,.55);
    }
    /* Chevrons above and below the handle: the only cue that it drags, now that there is no
       track. Drawn from two borders on a rotated square rather than set as glyphs — ⌃/⌄ render
       inconsistently across fonts, and this stays crisp at any pixel ratio. */
    #year::before, #year::after {
      content: ''; position: absolute; left: 50%; width: 7px; height: 7px;
      border: 2px solid var(--hot); border-width: 2px 2px 0 0; opacity: .8;
      filter: drop-shadow(0 1px 2px rgba(0,0,0,.7));   /* legible over pale basemap */
    }
    #year::before { top: -12px; transform: translateX(-50%) rotate(-45deg); }
    #year::after { bottom: -12px; transform: translateX(-50%) rotate(135deg); }
    /* At either end of the range, drop the arrow that points nowhere. */
    #year.at-min::after, #year.at-max::before { display: none; }
    /* MapLibre ships compact attribution but also adds -show, which forces the text open.
       Override that: collapse to just the (i), and reveal on hover or click (<details open>). */
    .maplibregl-ctrl-attrib.maplibregl-compact-show { padding: 2px 24px 2px 0; }
    .maplibregl-ctrl-attrib.maplibregl-compact-show .maplibregl-ctrl-attrib-inner { display: none; }
    .maplibregl-ctrl-attrib.maplibregl-compact:hover .maplibregl-ctrl-attrib-inner,
    .maplibregl-ctrl-attrib.maplibregl-compact[open] .maplibregl-ctrl-attrib-inner { display: block; }
    .maplibregl-ctrl-attrib.maplibregl-compact:hover,
    .maplibregl-ctrl-attrib.maplibregl-compact[open] { padding: 2px 28px 2px 8px; }
    .maplibregl-popup-content { background: #12161d; color: var(--ink);
      border-radius: 8px; border: 1px solid rgba(255,255,255,.12); }
    .maplibregl-popup-content b { color: #fff; }
    .maplibregl-popup-tip { border-top-color: #12161d !important;
      border-bottom-color: #12161d !important; }
  </style>
</head>
<body>
<div id="map"></div>

<div id="title" class="panel">
  <b>Wildfires of the West</b><br>
  <span id="subtitle">loading…</span>
</div>

<div id="rail" role="slider" tabindex="0" aria-label="Year" aria-orientation="vertical">
  <div id="year">—</div>
</div>

<script>
// ---------------------------------------------------------------------------
// Config
// ---------------------------------------------------------------------------
const BUILD = 'dev';                                 // CI rewrites this line to the commit SHA
const OFM = 'https://tiles.openfreemap.org';        // free vector tiles, no key
// Satellite (removed for now to keep the layer count minimal; re-add as a raster source +
// layer when wanted): https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}
const SEC_PER_YEAR = 0.75;                           // animation pace (years per screen-second)
const DAY = 86400000;

// recency ramp: age-in-days -> color (hot flare fading to a still-visible ember floor)
const RAMP = [
  0,      '#fff2b0',
  30,     '#ffcf40',
  120,    '#ff9526',
  365,    '#ff5f1a',
  1095,   '#e83c17',
  2920,   '#b23016',
  100000, '#8f2a15'
];

// ---------------------------------------------------------------------------
// Bland dark base style (OpenFreeMap / OpenMapTiles schema)
// ---------------------------------------------------------------------------
const style = {
  version: 8,
  glyphs: OFM + '/fonts/{fontstack}/{range}.pbf',
  sources: {
    omt: { type: 'vector', url: OFM + '/planet' }
  },
  layers: [
    { id: 'bg', type: 'background', paint: { 'background-color': '#0a0d12' } },
    { id: 'water', type: 'fill', source: 'omt', 'source-layer': 'water',
      paint: { 'fill-color': '#0d1622' } },
    // coastline / shoreline stroke — as legible as the state boundaries
    { id: 'coast', type: 'line', source: 'omt', 'source-layer': 'water',
      paint: { 'line-color': '#4d6076',
               'line-width': ['interpolate', ['linear'], ['zoom'], 3, 0.6, 7, 1.3, 12, 2.2] } },
    // landcover / parks — subtle, fade in with zoom
    { id: 'land-wood', type: 'fill', source: 'omt', 'source-layer': 'landcover',
      minzoom: 7, filter: ['match', ['get', 'class'], ['wood', 'forest'], true, false],
      paint: { 'fill-color': '#0f1a15',
               'fill-opacity': ['interpolate', ['linear'], ['zoom'], 7, 0, 11, 0.55] } },
    { id: 'land-park', type: 'fill', source: 'omt', 'source-layer': 'park',
      minzoom: 8, paint: { 'fill-color': '#111f19',
               'fill-opacity': ['interpolate', ['linear'], ['zoom'], 8, 0, 12, 0.5] } },

    // waterways: major rivers, then smaller streams deeper in
    { id: 'waterway-river', type: 'line', source: 'omt', 'source-layer': 'waterway',
      minzoom: 6, filter: ['==', 'class', 'river'],
      paint: { 'line-color': '#243c50',
               'line-width': ['interpolate', ['linear'], ['zoom'], 6, 0.5, 12, 1.8] } },
    { id: 'waterway-minor', type: 'line', source: 'omt', 'source-layer': 'waterway',
      minzoom: 11, filter: ['match', ['get', 'class'], ['stream', 'canal', 'drain', 'ditch'], true, false],
      paint: { 'line-color': '#1d3040',
               'line-width': ['interpolate', ['linear'], ['zoom'], 11, 0.4, 15, 1.2] } },

    // roads: motorways first, secondary + minor appear on zoom
    { id: 'road-major', type: 'line', source: 'omt', 'source-layer': 'transportation',
      minzoom: 4,
      filter: ['match', ['get', 'class'], ['motorway', 'trunk', 'primary'], true, false],
      paint: { 'line-color': '#6b7787',
               'line-width': ['interpolate', ['linear'], ['zoom'], 4, 0.5, 8, 1.1, 11, 1.9, 14, 3.4] } },
    { id: 'road-secondary', type: 'line', source: 'omt', 'source-layer': 'transportation',
      minzoom: 9,
      filter: ['match', ['get', 'class'], ['secondary', 'tertiary'], true, false],
      paint: { 'line-color': '#576270',
               'line-width': ['interpolate', ['linear'], ['zoom'], 9, 0.6, 15, 2.4] } },
    { id: 'road-minor', type: 'line', source: 'omt', 'source-layer': 'transportation',
      minzoom: 11,
      filter: ['match', ['get', 'class'], ['minor', 'service', 'track'], true, false],
      paint: { 'line-color': '#454f5d',
               'line-width': ['interpolate', ['linear'], ['zoom'], 11, 0.5, 16, 2.0] } },

    // buildings — deep zoom, very subtle
    { id: 'building', type: 'fill', source: 'omt', 'source-layer': 'building',
      minzoom: 13, paint: { 'fill-color': '#1b212a',
               'fill-opacity': ['interpolate', ['linear'], ['zoom'], 13, 0, 15, 0.6] } },

    // boundaries
    { id: 'boundary-state', type: 'line', source: 'omt', 'source-layer': 'boundary',
      filter: ['all', ['==', 'admin_level', 4], ['!=', 'maritime', 1]],
      // Cool grey-blue, well clear of the #0a0d12 background but not competing with the fires:
      // state lines are the frame you read the animation against, so they have to survive
      // being crossed by orange. Width grows with zoom so they stay legible when zoomed out.
      paint: { 'line-color': '#61748c', 'line-width': ['interpolate', ['linear'], ['zoom'],
                 3, 0.9, 6, 1.5, 10, 2.1], 'line-dasharray': [3, 2] } },
    { id: 'boundary-country', type: 'line', source: 'omt', 'source-layer': 'boundary',
      filter: ['all', ['<=', 'admin_level', 2], ['!=', 'maritime', 1]],
      paint: { 'line-color': '#8698ab', 'line-width': ['interpolate', ['linear'], ['zoom'],
                 3, 1.2, 6, 1.9, 10, 2.6] } },

    // places: dots + tiered labels — city/town, then village/hamlet on zoom
    { id: 'place-dot', type: 'circle', source: 'omt', 'source-layer': 'place',
      minzoom: 5, filter: ['match', ['get', 'class'], ['city', 'town', 'village', 'hamlet'], true, false],
      paint: { 'circle-radius': ['match', ['get', 'class'], 'city', 3, 'town', 2.3, 1.5],
               'circle-color': '#6b7e8c', 'circle-stroke-width': 0 } },
    { id: 'place-major', type: 'symbol', source: 'omt', 'source-layer': 'place',
      minzoom: 5, filter: ['match', ['get', 'class'], ['city', 'town'], true, false],
      layout: { 'text-field': ['coalesce', ['get', 'name:en'], ['get', 'name']],
                'text-font': ['Noto Sans Regular'],
                'text-size': ['interpolate', ['linear'], ['zoom'], 5, 10, 11, 15],
                'text-offset': [0, 0.8], 'text-anchor': 'top', 'text-max-width': 8,
                'symbol-sort-key': ['coalesce', ['get', 'rank'], 100] },
      paint: { 'text-color': '#9aa8b6', 'text-halo-color': '#0a0d12', 'text-halo-width': 1.3 } },
    { id: 'place-minor', type: 'symbol', source: 'omt', 'source-layer': 'place',
      minzoom: 9, filter: ['match', ['get', 'class'], ['village', 'hamlet', 'suburb', 'neighbourhood'], true, false],
      layout: { 'text-field': ['coalesce', ['get', 'name:en'], ['get', 'name']],
                'text-font': ['Noto Sans Regular'],
                'text-size': ['interpolate', ['linear'], ['zoom'], 9, 9, 14, 13],
                'text-offset': [0, 0.7], 'text-anchor': 'top', 'text-max-width': 7,
                'symbol-sort-key': ['coalesce', ['get', 'rank'], 100] },
      paint: { 'text-color': '#7f8d9b', 'text-halo-color': '#0a0d12', 'text-halo-width': 1.1 } }
  ]
};

const q = new URLSearchParams(location.search);

// ?data=west (default, 11 Western states) | ?data=wa (the WA test slice)
// `bounds` is the extent the opening view is fitted to — the full footprint of the data, rounded
// out to the state edges beyond it (the westernmost fire stops short of the Pacific coastline).
const DATASETS = {
  west: { file: 'data/west_fires.geojson.gz', label: 'Western US',
          center: [-116.0, 41.3], zoom: 4.15, bounds: [[-124.9, 31.2], [-101.9, 49.1]] },
  wa:   { file: 'data/wa_fires.geojson.gz',   label: 'Washington',
          center: [-120.3, 47.4], zoom: 6.15, bounds: [[-124.9, 45.4], [-116.8, 49.2]] }
};
const DS = DATASETS[q.get('data')] || DATASETS.west;
const DEBUG = q.has('debug');
const YEAR_MS = 750;                       // one year per 0.75s of screen time

function dlog(...a) { if (DEBUG) console.log(`[${BUILD}]`, ...a); }

// Opening view fits the whole dataset to the viewport, so every state is on screen whatever the
// window shape — a fixed zoom cannot do that (4.15 framed a laptop and clipped a phone).
// ?lng/?lat/?z still pin an exact camera, for sharing and for testing a specific spot.
const hasCamera = q.has('lng') || q.has('lat') || q.has('z');
const fitPadding = () => {
  const p = Math.max(10, Math.round(Math.min(innerWidth, innerHeight) * 0.045));
  return { top: p, bottom: p, left: p, right: p + 26 };   // extra right: the handle floats there
};

const map = new maplibregl.Map({
  container: 'map', style,
  ...(hasCamera
    ? { center: [parseFloat(q.get('lng') || DS.center[0]), parseFloat(q.get('lat') || DS.center[1])],
        zoom: parseFloat(q.get('z') || DS.zoom) }
    : { bounds: DS.bounds, fitBoundsOptions: { padding: fitPadding() } }),
  minzoom: 2.5, maxzoom: 17,               // 2.5, so a very small window can still fit the West
  attributionControl: false                // re-added bottom-left, clear of the year rail
});
// Both live bottom-left: the whole right edge belongs to the year rail.
map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'bottom-left');
map.addControl(new maplibregl.AttributionControl({ compact: true }), 'bottom-left');
// MapLibre renders the attribution <details> already open, so it shows as a wide pill. Close it
// once so it starts as just the (i); clicking/tapping the (i) still toggles it open (see CSS).
map.on('load', () => document.querySelector('.maplibregl-ctrl-attrib')?.removeAttribute('open'));
// Always on: an invalid paint expression once silently dropped an entire layer, and only the
// error event revealed it.
map.on('error', e => console.error('MAP ERROR:', e.error?.message || e));

// ---------------------------------------------------------------------------
// Palette — age in years to colour + opacity. Built once from a few anchors; after
// that it is pure table lookup, so there is no colour maths at animation time.
// ---------------------------------------------------------------------------
const AGES = 41;
const ANCHORS = [           // [age in years, colour, opacity]
  [0,  '#fff2b0', 0.95],    // this year — flare
  [1,  '#ff9526', 0.85],
  [3,  '#ff5f1a', 0.75],
  [8,  '#e83c17', 0.66],
  [20, '#b23016', 0.59],
  [40, '#8f2a15', 0.55]     // ember floor — never invisible
];
const COLOR = [], OPACITY = [];
for (let a = 0; a < AGES; a++) {
  let i = 0;
  while (i < ANCHORS.length - 2 && a > ANCHORS[i + 1][0]) i++;
  const [x0, c0, o0] = ANCHORS[i], [x1, c1, o1] = ANCHORS[i + 1];
  const t = Math.min(1, (a - x0) / (x1 - x0));
  const ch = (from, to) => Math.round(parseInt(from, 16) + (parseInt(to, 16) - parseInt(from, 16)) * t)
                             .toString(16).padStart(2, '0');
  COLOR[a] = '#' + ch(c0.slice(1, 3), c1.slice(1, 3)) + ch(c0.slice(3, 5), c1.slice(3, 5))
                 + ch(c0.slice(5, 7), c1.slice(5, 7));
  OPACITY[a] = +(o0 + (o1 - o0) * t).toFixed(3);
}

// ---------------------------------------------------------------------------
// The whole animation state is ONE integer: idx, the index of the year on show.
// Every paint value is a constant scalar (a GPU uniform) looked up by age, so there
// are no data-driven expressions, no time quantisation, and no cached-state tracking.
// N yearly states, and that is the entire state space.
// ---------------------------------------------------------------------------
let years = [], layers = [], N = 0, idx = 0, raf = null, fires = [], popup = null;
const NOTHING = { type: 'FeatureCollection', features: [] };
// `pos` is the handle's position as a *fractional* year index. It is presentation only: the map
// still has exactly N integer states, and `idx` is still the whole of the animation's state.
// Decoupling the two is what lets the handle glide while the fires step.
let pos = 0;

function show(i) {
  idx = Math.max(0, Math.min(N - 1, i));
  for (let k = 0; k < N; k++) {
    const a = Math.min(idx - k, AGES - 1);          // age of year k, in years
    map.setPaintProperty(layers[k], 'fill-opacity', a < 0 ? 0 : OPACITY[a]);
    if (a >= 0) map.setPaintProperty(layers[k], 'fill-color', COLOR[a]);
  }
  labelHandle();
}

function snapTo(i) { show(i); moveHandle(i); }      // jump both together

// --- Year rail -------------------------------------------------------------
// The handle's travel is inset from the window edges so the lozenge never half-leaves the
// screen at either end. Geometry is read live rather than cached: the map is full-bleed, so
// a rotation or resize changes the rail height under us.
const RAIL_PAD = 44;                                  // px of travel reserved at each end
const rail = () => document.getElementById('rail');
function railGeom() {
  const r = rail().getBoundingClientRect();
  return { top: r.top, height: r.height, span: Math.max(1, r.height - 2 * RAIL_PAD) };
}

// Position only — a float year index. Cheap enough to call every frame: it writes one CSS
// length and touches nothing MapLibre owns.
function moveHandle(p) {
  pos = Math.max(0, Math.min(N - 1, p));
  const { span } = railGeom();
  const t = N > 1 ? pos / (N - 1) : 0;                // 0 = earliest, at the bottom
  document.getElementById('year').style.bottom = (RAIL_PAD + t * span) + 'px';
}

// Text and state — driven by the integer year, so the label never shows a year the map is not
// actually displaying, however far between years the handle happens to sit.
function labelHandle() {
  const el = document.getElementById('year');
  el.textContent = years[idx] ?? '—';
  el.classList.toggle('at-min', idx <= 0);           // 1984: only the up arrow
  el.classList.toggle('at-max', N > 0 && idx >= N - 1);   // 2024: only the down arrow
  const r = rail();
  r.setAttribute('aria-valuemin', 0);
  r.setAttribute('aria-valuemax', Math.max(0, N - 1));
  r.setAttribute('aria-valuenow', idx);
  r.setAttribute('aria-valuetext', years[idx] ?? '');
}

function posAtY(clientY) {
  const g = railGeom();
  const fromBottom = g.top + g.height - clientY;      // invert: y grows downward, years upward
  const t = (fromBottom - RAIL_PAD) / g.span;
  return Math.max(0, Math.min(1, t)) * (N - 1);
}

// Driven by rAF rather than setInterval so the handle advances with the display refresh instead
// of once per year. The map is still repainted only when the integer year changes — the frame
// loop moves a DOM element and nothing else.
function play() {
  if (idx >= N - 1) snapTo(0);                       // replay from the top
  cancelAnimationFrame(raf);
  const from = pos, t0 = performance.now();
  const frame = now => {
    const p = Math.min(N - 1, from + (now - t0) / YEAR_MS);
    moveHandle(p);
    const yr = Math.floor(p + 1e-6);
    if (yr !== idx) { show(yr); dlog(`${years[idx]}  (state ${idx + 1}/${N})`); }
    if (p >= N - 1) {
      raf = null; show(N - 1); syncURL();            // parked on the final year: now shareable
      dlog('DONE — final year shown, no further updates');
      return;
    }
    raf = requestAnimationFrame(frame);
  };
  raf = requestAnimationFrame(frame);
}
function pause() { cancelAnimationFrame(raf); raf = null; }

// "1990-09-07" -> "7 September 1990".
// The 'T00:00' matters: a bare "1990-09-07" is parsed as UTC and renders as the 6th anywhere
// west of Greenwich, i.e. everywhere this map covers. With a time and no Z it is local.
function longDate(iso) {
  const d = new Date(iso + 'T00:00');
  return isNaN(d) ? iso
    : d.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
}

// Removing the popup fires its close handler, which clears the outline — so this takes down
// both. Safe to call when nothing is open.
function closePopup() { if (popup) { popup.remove(); popup = null; } }

// --- Shareable view state --------------------------------------------------
// The camera and the parked year are mirrored into the query string, so any view can be copied
// out of the address bar. These are the same parameters the page already reads on load.
// replaceState rather than pushState: panning and scrubbing should not fill the back button.
// Existing parameters (data, debug) are preserved rather than rebuilt.
let urlTimer = null;
function syncURL() {
  clearTimeout(urlTimer);
  urlTimer = setTimeout(() => {
    const c = map.getCenter();
    const p = new URLSearchParams(location.search);
    p.set('lng', c.lng.toFixed(4));                  // ~11 m, enough to land on the same fire
    p.set('lat', c.lat.toFixed(4));
    p.set('z', map.getZoom().toFixed(2));
    // Only a parked year is worth sharing. Mid-run the year is a moving target, and a link
    // carrying one would open on a stopped animation instead of playing.
    if (raf) p.delete('year'); else p.set('year', years[idx]);
    history.replaceState(null, '', location.pathname + '?' + p);
  }, 200);
}

// Keep the panel off the burn it describes. The fire's screen bounding box decides which side
// has room; anchor names are where the *popup's* own edge sits, so 'bottom' puts it above the
// shape, 'top' below, 'right' to the left, 'left' to the right.
const POPUP_W = 240, POPUP_H = 96, GAP = 14, RAIL_W = 56;
function popupPlacement(feature, fallback) {
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity, n = 0;
  const visit = c => {
    if (typeof c[0] === 'number') {
      const q = map.project(c);
      if (q.x < minX) minX = q.x;
      if (q.x > maxX) maxX = q.x;
      if (q.y < minY) minY = q.y;
      if (q.y > maxY) maxY = q.y;
      n++;
    } else for (const part of c) visit(part);
  };
  if (feature?.geometry) visit(feature.geometry.coordinates);
  if (!n) return { lngLat: fallback, anchor: 'bottom' };

  const W = innerWidth, H = innerHeight;
  const room = { bottom: minY - GAP, top: H - maxY - GAP,
                 right: minX - GAP, left: W - RAIL_W - maxX - GAP };
  const need = { bottom: POPUP_H, top: POPUP_H, right: POPUP_W, left: POPUP_W };
  // Above, then below, then the sides — reading order, and vertical displacement hides less map.
  const pick = ['bottom', 'top', 'right', 'left'].find(a => room[a] >= need[a]);
  if (!pick) return { lngLat: fallback, anchor: 'bottom' };   // a burn filling the screen

  // Centre along the shared edge, pulled back far enough that the panel stays on screen when
  // the fire runs off it.
  const cx = Math.min(Math.max((minX + maxX) / 2, POPUP_W / 2 + GAP), W - RAIL_W - POPUP_W / 2 - GAP);
  const cy = Math.min(Math.max((minY + maxY) / 2, POPUP_H / 2 + GAP), H - POPUP_H / 2 - GAP);
  const at = { bottom: [cx, minY], top: [cx, maxY], right: [minX, cy], left: [maxX, cy] }[pick];
  return { lngLat: map.unproject(at), anchor: pick };
}

function wireControls() {
  // Dragging anywhere in the rail scrubs. Pointer capture keeps the drag alive when the finger
  // or cursor wanders off the 56px strip, which on a phone it constantly does.
  const r = rail();
  let dragging = false;
  // The handle follows the pointer exactly, so the drag feels 1:1; the map only repaints when
  // the rounded year changes. Without that guard every pointermove would rewrite N paint
  // properties, which is the expensive half of this loop.
  const track = clientY => {
    const p = posAtY(clientY);
    moveHandle(p);
    const yr = Math.round(p);
    if (yr !== idx) show(yr);
  };
  r.addEventListener('pointerdown', e => {
    // A popup describes one year's fire; scrubbing away from that year makes it stale, and it
    // would sit over the map with its outline pointing at nothing.
    closePopup();
    dragging = true; pause(); r.setPointerCapture(e.pointerId);
    track(e.clientY); e.preventDefault();
  });
  r.addEventListener('pointermove', e => { if (dragging) track(e.clientY); });
  const end = e => {
    if (!dragging) return;
    dragging = false;
    moveHandle(idx);                                 // settle onto the year it landed on
    if (r.hasPointerCapture(e.pointerId)) r.releasePointerCapture(e.pointerId);
    syncURL();
  };
  r.addEventListener('pointerup', end);
  r.addEventListener('pointercancel', end);

  r.addEventListener('keydown', e => {
    const step = { ArrowUp: 1, ArrowRight: 1, ArrowDown: -1, ArrowLeft: -1,
                   PageUp: 5, PageDown: -5 }[e.key];
    if (step) { closePopup(); pause(); snapTo(idx + step); }
    else if (e.key === 'Home') { closePopup(); pause(); snapTo(0); }
    else if (e.key === 'End') { closePopup(); pause(); snapTo(N - 1); }
    else return;
    syncURL();
    e.preventDefault();
  });

  // Only user-driven movement is recorded. A programmatic move — notably the opening fitBounds
  // — has no originalEvent, and writing that would pin the camera before anyone had touched it,
  // costing the fit-to-viewport behaviour on the next load.
  map.on('moveend', e => { if (e.originalEvent) syncURL(); });

  // Rail height changes on resize and rotation, so the handle has to be re-placed.
  addEventListener('resize', () => moveHandle(pos));
  // Pointer cursor over a clickable fire (a point query, not a viewport-wide one — those are
  // costly and nudge MapLibre's render state). Empty string restores the default grab hand.
  map.on('mousemove', e => {
    const over = map.queryRenderedFeatures(e.point, { layers })
      .some(f => f.properties.year <= years[idx]);
    map.getCanvas().style.cursor = over ? 'pointer' : '';
  });

  // A click parks the animation on the year it is showing and, if a fire was hit, names it.
  // Panning and zooming work at all times, playing or paused — there is no separate mode.
  map.on('click', e => {
    pause();
    syncURL();                                       // a click parks the year — record it
    const hits = map.queryRenderedFeatures(e.point, { layers })
      .filter(f => f.properties.year <= years[idx]);   // ignore years not yet shown
    // Close first: removing a popup fires its close handler, which clears the outline. Doing it
    // before the new one is drawn stops the old handler wiping the new selection.
    closePopup();
    if (!hits.length) return;
    const p = hits[0].properties;
    // Always three lines: name, date, acreage. Type and assessment are dropped — 87% of these
    // are "Wildfire" and 62% "Initial", so the words carried almost no information. The one
    // feature with no acreage still gets a third line, rather than a stray "0 acres".
    const acres = p.acres == null ? 'acreage unknown'
                                  : `${Math.round(p.acres).toLocaleString()} acres`;
    // Stroke the fire being described, from the full original geometry rather than the clipped
    // copy the query returned.
    const feature = fires[p.fid];
    map.getSource('sel').setData(feature ?? NOTHING);
    const { lngLat, anchor } = popupPlacement(feature, e.lngLat);
    popup = new maplibregl.Popup({ anchor, offset: GAP }).setLngLat(lngLat)
      .setHTML(`<b>${p.name}</b><br>${longDate(p.ig_date)}<br>${acres}`)
      .addTo(map);
    popup.on('close', () => map.getSource('sel')?.setData(NOTHING));
  });
}

// ---------------------------------------------------------------------------
// Datasets ship gzipped and are inflated in the browser, so a static host needs no
// content-encoding config. Gzip magic-byte detection means it also works if the host
// does send Content-Encoding: gzip (in which case the browser already decompressed).
// ---------------------------------------------------------------------------
async function loadFires(url) {
  const buf = await (await fetch(url)).arrayBuffer();
  const u8 = new Uint8Array(buf);
  if (u8[0] === 0x1f && u8[1] === 0x8b) {
    const stream = new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'));
    return new Response(stream).json();
  }
  return JSON.parse(new TextDecoder().decode(u8));
}

Promise.all([loadFires(DS.file), new Promise(res => map.on('load', res))]).then(([fc]) => {
  const seen = new Set();
  fc.features.forEach((f, i) => {
    f.properties.year = +f.properties.ig_date.slice(0, 4);
    f.properties.fid = i;              // identifies the clicked fire; indexes back into `fires`
    seen.add(f.properties.year);
  });
  fires = fc.features;
  years = [...seen].sort((a, b) => a - b);
  N = years.length;

  map.addSource('fires', { type: 'geojson', data: fc });
  // One fill layer per year, added oldest-first so newer fires draw on top. The filter is
  // static; only the constant colour/opacity ever change.
  years.forEach((y, k) => {
    layers[k] = 'yr-' + y;
    map.addLayer({
      id: layers[k], type: 'fill', source: 'fires',
      filter: ['==', ['get', 'year'], y],
      paint: { 'fill-color': COLOR[AGES - 1], 'fill-opacity': 0 }
    });
  });

  // The selected fire's outline. Its own tiny source rather than a filter on `fires`: changing
  // a filter on an 11k-feature layer re-lays it out, and the geometry that comes back from
  // queryRenderedFeatures is clipped at tile edges, which would stroke only part of a big burn.
  // Added last, so it sits above every year layer.
  map.addSource('sel', { type: 'geojson', data: NOTHING });
  map.addLayer({
    id: 'sel-line', type: 'line', source: 'sel',
    paint: { 'line-color': '#fff2b0', 'line-width': 2, 'line-opacity': 0.95 }
  });

  // Only a non-default dataset is named: on the full West the heading already says so, and
  // repeating it wastes the line. The ?data=wa slice still needs the label to be obvious.
  const region = DS === DATASETS.west ? '' : `${DS.label} · `;
  document.getElementById('subtitle').textContent =
    `${region}${years[0]}–${years[N - 1]} · ${fc.features.length.toLocaleString()} fires · ` +
    `${Math.round(N * YEAR_MS / 1000)}s · build ${BUILD}`;
  wireControls();
  dlog(`${fc.features.length} fires, ${N} yearly states, ${layers.length} layers`);
  const jump = years.indexOf(+q.get('year'));        // ?year=1995 parks there, for sharing/testing
  if (jump >= 0) snapTo(jump);
  else { snapTo(0); play(); }
});
</script>
</body>
</html>
