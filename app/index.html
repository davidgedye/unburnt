<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>40 years of fire — Western US</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.js"></script>
  <link href="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.css" rel="stylesheet">
  <style>
    :root { --panel: rgba(16,20,27,.86); --ink: #c3ccd6; --dim: #7a8794; --hot: #ff7a1a; }
    html, body, #map { margin: 0; height: 100%; background: #0a0d12; }
    #map { position: absolute; inset: 0; }
    .panel {
      position: absolute; z-index: 2; background: var(--panel);
      color: var(--ink); border: 1px solid rgba(255,255,255,.08);
      border-radius: 10px; font: 13px/1.5 system-ui, sans-serif;
      backdrop-filter: blur(8px); box-shadow: 0 4px 20px rgba(0,0,0,.5);
    }
    /* Title (top-left) */
    #title { top: 12px; left: 12px; padding: 10px 14px; max-width: 300px; }
    #title b { color: #fff; font-size: 15px; }
    #title span { color: var(--dim); font-size: 12px; }
    /* Timeline (bottom) — play button, season clock, scrubber */
    #timeline { left: 12px; right: 12px; bottom: 12px; padding: 10px 14px;
      display: flex; align-items: center; gap: 13px; }
    #play {
      flex: none; width: 38px; height: 38px; border-radius: 50%; cursor: pointer;
      background: var(--hot); border: none; padding: 0;
      display: grid; place-items: center; -webkit-tap-highlight-color: transparent;
    }
    #play:hover { filter: brightness(1.12); }
    #play svg { display: block; fill: #150a02; }
    #clock { font: 700 15px/1 ui-monospace, monospace; color: #fff;
      min-width: 112px; letter-spacing: .02em; }
    #clock small { display: block; font: 500 10px system-ui; color: var(--dim);
      letter-spacing: .1em; text-transform: uppercase; margin-bottom: 3px; }
    #scrub { flex: 1; accent-color: var(--hot); height: 4px; cursor: pointer; min-width: 0; }
    /* Legend (bottom-left, above timeline) */
    #legend { left: 12px; bottom: 78px; padding: 9px 12px; font-size: 12px; }
    #legend .row { display: flex; align-items: center; gap: 7px; margin: 3px 0; }
    #legend .sw { width: 22px; height: 10px; border-radius: 2px; }
    #legend h4 { margin: 0 0 5px; font-size: 11px; letter-spacing: .06em;
      text-transform: uppercase; color: var(--dim); font-weight: 600; }
    .maplibregl-popup-content { background: #12161d; color: var(--ink);
      border-radius: 8px; border: 1px solid rgba(255,255,255,.12); }
    .maplibregl-popup-content b { color: #fff; }
    .maplibregl-popup-tip { border-top-color: #12161d !important;
      border-bottom-color: #12161d !important; }
  </style>
</head>
<body>
<div id="map"></div>

<div id="title" class="panel">
  <b>40 years of fire — <span id="region">…</span></b><br>
  <span id="subtitle">loading…</span>
</div>

<div id="legend" class="panel">
  <h4 id="legend-title">Fire recency</h4>
  <div id="legend-body"></div>
</div>

<div id="timeline" class="panel">
  <button id="play" aria-label="Play"></button>
  <div id="clock"><small>Season</small><span id="clock-date">—</span></div>
  <input type="range" id="scrub" min="0" max="1000" value="0" aria-label="Timeline">
</div>

<script>
// ---------------------------------------------------------------------------
// Config
// ---------------------------------------------------------------------------
const BUILD = 21;                                     // bump on every change — shown in the UI
const OFM = 'https://tiles.openfreemap.org';        // free vector tiles, no key
// Satellite (removed for now to keep the layer count minimal; re-add as a raster source +
// layer when wanted): https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}
const SEC_PER_YEAR = 0.75;                           // animation pace (years per screen-second)
const DAY = 86400000;

// recency ramp: age-in-days -> color (hot flare fading to a still-visible ember floor)
const RAMP = [
  0,      '#fff2b0',
  30,     '#ffcf40',
  120,    '#ff9526',
  365,    '#ff5f1a',
  1095,   '#e83c17',
  2920,   '#b23016',
  100000, '#8f2a15'
];

// ---------------------------------------------------------------------------
// Bland dark base style (OpenFreeMap / OpenMapTiles schema)
// ---------------------------------------------------------------------------
const style = {
  version: 8,
  glyphs: OFM + '/fonts/{fontstack}/{range}.pbf',
  sources: {
    omt: { type: 'vector', url: OFM + '/planet' }
  },
  layers: [
    { id: 'bg', type: 'background', paint: { 'background-color': '#0a0d12' } },
    { id: 'water', type: 'fill', source: 'omt', 'source-layer': 'water',
      paint: { 'fill-color': '#0d1622' } },
    // coastline / shoreline stroke — as legible as the state boundaries
    { id: 'coast', type: 'line', source: 'omt', 'source-layer': 'water',
      paint: { 'line-color': '#4d6076',
               'line-width': ['interpolate', ['linear'], ['zoom'], 3, 0.6, 7, 1.3, 12, 2.2] } },
    // landcover / parks — subtle, fade in with zoom
    { id: 'land-wood', type: 'fill', source: 'omt', 'source-layer': 'landcover',
      minzoom: 7, filter: ['match', ['get', 'class'], ['wood', 'forest'], true, false],
      paint: { 'fill-color': '#0f1a15',
               'fill-opacity': ['interpolate', ['linear'], ['zoom'], 7, 0, 11, 0.55] } },
    { id: 'land-park', type: 'fill', source: 'omt', 'source-layer': 'park',
      minzoom: 8, paint: { 'fill-color': '#111f19',
               'fill-opacity': ['interpolate', ['linear'], ['zoom'], 8, 0, 12, 0.5] } },

    // waterways: major rivers, then smaller streams deeper in
    { id: 'waterway-river', type: 'line', source: 'omt', 'source-layer': 'waterway',
      minzoom: 6, filter: ['==', 'class', 'river'],
      paint: { 'line-color': '#243c50',
               'line-width': ['interpolate', ['linear'], ['zoom'], 6, 0.5, 12, 1.8] } },
    { id: 'waterway-minor', type: 'line', source: 'omt', 'source-layer': 'waterway',
      minzoom: 11, filter: ['match', ['get', 'class'], ['stream', 'canal', 'drain', 'ditch'], true, false],
      paint: { 'line-color': '#1d3040',
               'line-width': ['interpolate', ['linear'], ['zoom'], 11, 0.4, 15, 1.2] } },

    // roads: motorways first, secondary + minor appear on zoom
    { id: 'road-major', type: 'line', source: 'omt', 'source-layer': 'transportation',
      minzoom: 4,
      filter: ['match', ['get', 'class'], ['motorway', 'trunk', 'primary'], true, false],
      paint: { 'line-color': '#6b7787',
               'line-width': ['interpolate', ['linear'], ['zoom'], 4, 0.5, 8, 1.1, 11, 1.9, 14, 3.4] } },
    { id: 'road-secondary', type: 'line', source: 'omt', 'source-layer': 'transportation',
      minzoom: 9,
      filter: ['match', ['get', 'class'], ['secondary', 'tertiary'], true, false],
      paint: { 'line-color': '#576270',
               'line-width': ['interpolate', ['linear'], ['zoom'], 9, 0.6, 15, 2.4] } },
    { id: 'road-minor', type: 'line', source: 'omt', 'source-layer': 'transportation',
      minzoom: 11,
      filter: ['match', ['get', 'class'], ['minor', 'service', 'track'], true, false],
      paint: { 'line-color': '#454f5d',
               'line-width': ['interpolate', ['linear'], ['zoom'], 11, 0.5, 16, 2.0] } },

    // buildings — deep zoom, very subtle
    { id: 'building', type: 'fill', source: 'omt', 'source-layer': 'building',
      minzoom: 13, paint: { 'fill-color': '#1b212a',
               'fill-opacity': ['interpolate', ['linear'], ['zoom'], 13, 0, 15, 0.6] } },

    // boundaries
    { id: 'boundary-state', type: 'line', source: 'omt', 'source-layer': 'boundary',
      filter: ['all', ['==', 'admin_level', 4], ['!=', 'maritime', 1]],
      paint: { 'line-color': '#2e3946', 'line-width': 0.8, 'line-dasharray': [3, 2] } },
    { id: 'boundary-country', type: 'line', source: 'omt', 'source-layer': 'boundary',
      filter: ['all', ['<=', 'admin_level', 2], ['!=', 'maritime', 1]],
      paint: { 'line-color': '#404e5e', 'line-width': 1.1 } },

    // places: dots + tiered labels — city/town, then village/hamlet on zoom
    { id: 'place-dot', type: 'circle', source: 'omt', 'source-layer': 'place',
      minzoom: 5, filter: ['match', ['get', 'class'], ['city', 'town', 'village', 'hamlet'], true, false],
      paint: { 'circle-radius': ['match', ['get', 'class'], 'city', 3, 'town', 2.3, 1.5],
               'circle-color': '#6b7e8c', 'circle-stroke-width': 0 } },
    { id: 'place-major', type: 'symbol', source: 'omt', 'source-layer': 'place',
      minzoom: 5, filter: ['match', ['get', 'class'], ['city', 'town'], true, false],
      layout: { 'text-field': ['coalesce', ['get', 'name:en'], ['get', 'name']],
                'text-font': ['Noto Sans Regular'],
                'text-size': ['interpolate', ['linear'], ['zoom'], 5, 10, 11, 15],
                'text-offset': [0, 0.8], 'text-anchor': 'top', 'text-max-width': 8,
                'symbol-sort-key': ['coalesce', ['get', 'rank'], 100] },
      paint: { 'text-color': '#9aa8b6', 'text-halo-color': '#0a0d12', 'text-halo-width': 1.3 } },
    { id: 'place-minor', type: 'symbol', source: 'omt', 'source-layer': 'place',
      minzoom: 9, filter: ['match', ['get', 'class'], ['village', 'hamlet', 'suburb', 'neighbourhood'], true, false],
      layout: { 'text-field': ['coalesce', ['get', 'name:en'], ['get', 'name']],
                'text-font': ['Noto Sans Regular'],
                'text-size': ['interpolate', ['linear'], ['zoom'], 9, 9, 14, 13],
                'text-offset': [0, 0.7], 'text-anchor': 'top', 'text-max-width': 7,
                'symbol-sort-key': ['coalesce', ['get', 'rank'], 100] },
      paint: { 'text-color': '#7f8d9b', 'text-halo-color': '#0a0d12', 'text-halo-width': 1.1 } }
  ]
};

const q = new URLSearchParams(location.search);

// ?data=west (default, 11 Western states) | ?data=wa (the WA test slice)
const DATASETS = {
  west: { file: 'data/west_fires.geojson.gz', label: 'Western US', center: [-116.0, 41.3], zoom: 4.15 },
  wa:   { file: 'data/wa_fires.geojson.gz',   label: 'Washington', center: [-120.3, 47.4], zoom: 6.15 }
};
const DS = DATASETS[q.get('data')] || DATASETS.west;
const DEBUG = q.has('debug');
const YEAR_MS = 750;                       // one year per 0.75s of screen time

function dlog(...a) { if (DEBUG) console.log(`[b${BUILD}]`, ...a); }

const map = new maplibregl.Map({
  container: 'map', style,
  center: [parseFloat(q.get('lng') || DS.center[0]), parseFloat(q.get('lat') || DS.center[1])],
  zoom: parseFloat(q.get('z') || DS.zoom), minzoom: 3, maxzoom: 17,
  attributionControl: false                // re-added top-right, clear of the timeline
});
map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'top-right');
map.addControl(new maplibregl.AttributionControl({ compact: true }), 'top-right');
// Always on: an invalid paint expression once silently dropped an entire layer, and only the
// error event revealed it.
map.on('error', e => console.error('MAP ERROR:', e.error?.message || e));

// ---------------------------------------------------------------------------
// Palette — age in years to colour + opacity. Built once from a few anchors; after
// that it is pure table lookup, so there is no colour maths at animation time.
// ---------------------------------------------------------------------------
const AGES = 41;
const ANCHORS = [           // [age in years, colour, opacity]
  [0,  '#fff2b0', 0.95],    // this year — flare
  [1,  '#ff9526', 0.85],
  [3,  '#ff5f1a', 0.75],
  [8,  '#e83c17', 0.66],
  [20, '#b23016', 0.59],
  [40, '#8f2a15', 0.55]     // ember floor — never invisible
];
const COLOR = [], OPACITY = [];
for (let a = 0; a < AGES; a++) {
  let i = 0;
  while (i < ANCHORS.length - 2 && a > ANCHORS[i + 1][0]) i++;
  const [x0, c0, o0] = ANCHORS[i], [x1, c1, o1] = ANCHORS[i + 1];
  const t = Math.min(1, (a - x0) / (x1 - x0));
  const ch = (from, to) => Math.round(parseInt(from, 16) + (parseInt(to, 16) - parseInt(from, 16)) * t)
                             .toString(16).padStart(2, '0');
  COLOR[a] = '#' + ch(c0.slice(1, 3), c1.slice(1, 3)) + ch(c0.slice(3, 5), c1.slice(3, 5))
                 + ch(c0.slice(5, 7), c1.slice(5, 7));
  OPACITY[a] = +(o0 + (o1 - o0) * t).toFixed(3);
}

// ---------------------------------------------------------------------------
// The whole animation state is ONE integer: idx, the index of the year on show.
// Every paint value is a constant scalar (a GPU uniform) looked up by age, so there
// are no data-driven expressions, no time quantisation, and no cached-state tracking.
// N yearly states, and that is the entire state space.
// ---------------------------------------------------------------------------
let years = [], layers = [], N = 0, idx = 0, timer = null;

function show(i) {
  idx = Math.max(0, Math.min(N - 1, i));
  for (let k = 0; k < N; k++) {
    const a = Math.min(idx - k, AGES - 1);          // age of year k, in years
    map.setPaintProperty(layers[k], 'fill-opacity', a < 0 ? 0 : OPACITY[a]);
    if (a >= 0) map.setPaintProperty(layers[k], 'fill-color', COLOR[a]);
  }
  document.getElementById('clock-date').textContent = years[idx];
  const s = document.getElementById('scrub');
  if (document.activeElement !== s) s.value = idx;
}

const ICON_PLAY = '<svg width="14" height="16" viewBox="0 0 14 16"><path d="M1 1l12 7-12 7z"/></svg>';
const ICON_PAUSE = '<svg width="12" height="16" viewBox="0 0 12 16"><rect x="0" y="1" width="4" height="14" rx="1"/><rect x="8" y="1" width="4" height="14" rx="1"/></svg>';
function setPlayIcon() {
  const b = document.getElementById('play');
  b.innerHTML = timer ? ICON_PAUSE : ICON_PLAY;
  b.setAttribute('aria-label', timer ? 'Pause' : (idx >= N - 1 ? 'Replay' : 'Play'));
}

function play() {
  if (idx >= N - 1) show(0);                        // replay from the top
  clearInterval(timer);
  timer = setInterval(() => {
    if (idx >= N - 1) { pause(); dlog('DONE — final year shown, no further updates'); return; }
    show(idx + 1);
    dlog(`${years[idx]}  (state ${idx + 1}/${N})`);
  }, YEAR_MS);
  setPlayIcon();
}
function pause() { clearInterval(timer); timer = null; setPlayIcon(); }

function buildLegend() {
  document.getElementById('legend-title').textContent = 'Fire recency';
  document.getElementById('legend-body').innerHTML =
    `<div class="row"><span class="sw" style="background:${COLOR[0]}"></span>This year</div>` +
    `<div class="row"><span class="sw" style="background:${COLOR[1]}"></span>1 year ago</div>` +
    `<div class="row"><span class="sw" style="background:${COLOR[3]}"></span>3 years ago</div>` +
    `<div class="row"><span class="sw" style="background:${COLOR[AGES - 1]}"></span>Older</div>` +
    `<div class="row" style="color:var(--dim);margin-top:5px">Click the map to pause</div>`;
}

function wireControls() {
  document.getElementById('play').onclick = () => (timer ? pause() : play());
  document.getElementById('scrub').oninput = e => { pause(); show(+e.target.value); };
  // A click parks the animation on the year it is showing and, if a fire was hit, names it.
  // Panning and zooming work at all times, playing or paused — there is no separate mode.
  map.on('click', e => {
    pause();
    const hits = map.queryRenderedFeatures(e.point, { layers })
      .filter(f => f.properties.year <= years[idx]);   // ignore years not yet shown
    if (!hits.length) return;
    const p = hits[0].properties;
    new maplibregl.Popup().setLngLat(e.lngLat)
      .setHTML(`<b>${p.name}</b><br>${p.ig_date} · ${Math.round(p.acres).toLocaleString()} ac`
        + `<br><span style="color:#7a8794">${p.type} · ${p.asmnt} assessment</span>`)
      .addTo(map);
  });
}

// ---------------------------------------------------------------------------
// Datasets ship gzipped and are inflated in the browser, so a static host needs no
// content-encoding config. Gzip magic-byte detection means it also works if the host
// does send Content-Encoding: gzip (in which case the browser already decompressed).
// ---------------------------------------------------------------------------
async function loadFires(url) {
  const buf = await (await fetch(url)).arrayBuffer();
  const u8 = new Uint8Array(buf);
  if (u8[0] === 0x1f && u8[1] === 0x8b) {
    const stream = new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'));
    return new Response(stream).json();
  }
  return JSON.parse(new TextDecoder().decode(u8));
}

Promise.all([loadFires(DS.file), new Promise(res => map.on('load', res))]).then(([fc]) => {
  const seen = new Set();
  for (const f of fc.features) {
    f.properties.year = +f.properties.ig_date.slice(0, 4);
    seen.add(f.properties.year);
  }
  years = [...seen].sort((a, b) => a - b);
  N = years.length;

  map.addSource('fires', { type: 'geojson', data: fc });
  // One fill layer per year, added oldest-first so newer fires draw on top. The filter is
  // static; only the constant colour/opacity ever change.
  years.forEach((y, k) => {
    layers[k] = 'yr-' + y;
    map.addLayer({
      id: layers[k], type: 'fill', source: 'fires',
      filter: ['==', ['get', 'year'], y],
      paint: { 'fill-color': COLOR[AGES - 1], 'fill-opacity': 0 }
    });
  });

  document.getElementById('region').textContent = DS.label;
  document.getElementById('subtitle').textContent =
    `${years[0]}–${years[N - 1]} · ${fc.features.length.toLocaleString()} fires · ` +
    `${Math.round(N * YEAR_MS / 1000)}s · build ${BUILD}`;
  const s = document.getElementById('scrub');
  s.min = 0; s.max = N - 1; s.step = 1; s.value = 0;

  wireControls();
  buildLegend();
  setPlayIcon();          // the ?year= path never calls play(), so paint the icon here
  dlog(`${fc.features.length} fires, ${N} yearly states, ${layers.length} layers`);
  const jump = years.indexOf(+q.get('year'));        // ?year=1995 parks there, for sharing/testing
  if (jump >= 0) show(jump);
  else { show(0); play(); }
});
</script>
</body>
</html>
