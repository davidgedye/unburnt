<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>unburnt — PMTiles prototype (milestone 7)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.js"></script>
  <link href="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.css" rel="stylesheet">
  <script src="https://unpkg.com/pmtiles@3/dist/pmtiles.js"></script>
  <style>
    /* Deliberately the app's own palette and type, so a screenshot from here can be put next
       to a screenshot from the app and the only difference is the geometry. */
    :root { --panel: rgba(16,20,27,.86); --ink: #c3ccd6; --dim: #99a6b1; }
    html, body, #map { margin: 0; height: 100%; background: #0a0d12; }
    #map { position: absolute; inset: 0; }
    #hud {
      position: absolute; z-index: 2; top: 12px; left: 12px; padding: 10px 14px; max-width: 320px;
      background: var(--panel); color: var(--ink); border: 1px solid rgba(255,255,255,.08);
      border-radius: 10px; font: 13px/1.5 system-ui, sans-serif; backdrop-filter: blur(8px);
      box-shadow: 0 4px 20px rgba(0,0,0,.5);
    }
    #hud b { color: #fff; font-size: 15px; }
    #hud .k { font: 600 12px/1.4 ui-monospace, monospace; color: var(--dim); margin-top: 6px; }
    #hud button {
      margin-top: 8px; padding: 5px 9px; border: 0; border-radius: 5px; cursor: pointer;
      background: rgba(255,255,255,.08); color: var(--ink);
      font: 600 11.5px/1.2 system-ui, sans-serif;
    }
    #hud button[aria-pressed="true"] { background: #a04a24; color: #fff3ec; }
  </style>
</head>
<body>
<div id="map"></div>
<div id="hud">
  <b>PMTiles prototype</b>
  <div class="k" id="z">z—</div>
  <div>
    <button id="t-sev" aria-pressed="true">severity</button>
    <button id="t-per" aria-pressed="true">perimeters</button>
  </div>
</div>

<script>
// Milestone 7 prototype: 2020 perimeters + severity as a vector tileset, at the full 30 m
// fidelity the shipped GeoJSON has to throw away. tippecanoe generalises per zoom level, so
// z4 gets a coarse version and z13 gets everything — which is the whole argument for moving
// off whole-file GeoJSON. Nothing here touches the app.
const PM = 'http://localhost:8082/data/pmtiles/west.pmtiles';   // read by byte range, as from R2
maplibregl.addProtocol('pmtiles', new pmtiles.Protocol().tile);

const OFM = 'https://tiles.openfreemap.org';
// Same five severity classes and colours the app uses, so the comparison is only about geometry.
const SEV = [
  [1, '#4a5a6b', 0.80], [2, '#b98a3e', 0.85], [3, '#e0662a', 0.88],
  [4, '#c62020', 0.92], [5, '#4f9d8a', 0.85]
];

const map = new maplibregl.Map({
  container: 'map',
  style: {
    version: 8,
    glyphs: OFM + '/fonts/{fontstack}/{range}.pbf',
    sources: {
      omt: { type: 'vector', url: OFM + '/planet' },
      fire: { type: 'vector', url: 'pmtiles://' + PM }
    },
    layers: [
      { id: 'bg', type: 'background', paint: { 'background-color': '#0a0d12' } },
      { id: 'water', type: 'fill', source: 'omt', 'source-layer': 'water',
        paint: { 'fill-color': '#0d1622' } },
      { id: 'coast', type: 'line', source: 'omt', 'source-layer': 'water',
        paint: { 'line-color': '#4d6076', 'line-width': 1 } },
      { id: 'boundary', type: 'line', source: 'omt', 'source-layer': 'boundary',
        filter: ['all', ['==', 'admin_level', 4], ['!=', 'maritime', 1]],
        paint: { 'line-color': '#61748c', 'line-width': 1.4, 'line-dasharray': [3, 2] } },
      // The fire's own fill, as One year draws it: flare yellow.
      { id: 'perim-fill', type: 'fill', source: 'fire', 'source-layer': 'perimeters',
        paint: { 'fill-color': '#fff2b0', 'fill-opacity': 0.95 } },
      ...SEV.map(([c, color, op]) => ({
        id: 'sev-' + c, type: 'fill', source: 'fire', 'source-layer': 'severity',
        filter: ['==', ['get', 'sev'], c],
        paint: { 'fill-color': color, 'fill-opacity': op }
      })),
      { id: 'perim-line', type: 'line', source: 'fire', 'source-layer': 'perimeters',
        paint: { 'line-color': '#fff2b0', 'line-width': 1.6, 'line-opacity': 0.9 } }
    ]
  },
  center: [-121.5, 36.05], zoom: 10, minzoom: 4, maxzoom: 17,
  attributionControl: false
});
map.on('error', e => console.error('MAP ERROR:', e.error?.message || e));

const q = new URLSearchParams(location.search);
if (q.has('lng')) map.jumpTo({ center: [+q.get('lng'), +q.get('lat')], zoom: +q.get('z') });

const zEl = document.getElementById('z');
const showZ = () => { zEl.textContent = 'z' + map.getZoom().toFixed(2); };
map.on('move', showZ); map.on('load', showZ);

const toggle = (btn, ids) => btn.addEventListener('click', () => {
  const on = btn.getAttribute('aria-pressed') !== 'true';
  btn.setAttribute('aria-pressed', String(on));
  ids.forEach(id => map.setLayoutProperty(id, 'visibility', on ? 'visible' : 'none'));
});
map.on('load', () => {
  toggle(document.getElementById('t-sev'), SEV.map(([c]) => 'sev-' + c));
  toggle(document.getElementById('t-per'), ['perim-fill', 'perim-line']);
});
</script>
</body>
</html>
