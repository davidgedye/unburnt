<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>unburnt — WA validation slice</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.js"></script>
  <link href="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.css" rel="stylesheet">
  <style>
    html, body, #map { margin: 0; height: 100%; }
    #legend {
      position: absolute; bottom: 24px; left: 12px; z-index: 1;
      background: rgba(255,255,255,.92); padding: 10px 14px; border-radius: 6px;
      font: 13px/1.6 system-ui, sans-serif; box-shadow: 0 1px 4px rgba(0,0,0,.3);
    }
    #legend .sw { display: inline-block; width: 14px; height: 14px; margin-right: 6px; vertical-align: -2px; border-radius: 2px; }
    #legend label { display: block; cursor: pointer; }
  </style>
</head>
<body>
<div id="map"></div>
<div id="legend">
  <b>MTBS burn severity — WA</b><br>
  <label><input type="checkbox" id="y2023" checked> 2023 (complete)</label>
  <label><input type="checkbox" id="y2024" checked> 2024 (partial — 2/17 fires assessed)</label>
  <hr style="border:none;border-top:1px solid #ccc">
  <span class="sw" style="background:#ffffbe"></span>Low<br>
  <span class="sw" style="background:#ff8c00"></span>Moderate<br>
  <span class="sw" style="background:#e60000"></span>High<br>
  <span class="sw" style="background:#7fffd4"></span>Unburned–low / greenness<br>
  <span style="color:#555">Solid outline = 2023, dashed = 2024</span>
</div>
<script>
const q = new URLSearchParams(location.search);
const YEARS = ['2023', '2024'];
const style = {
  version: 8,
  sources: {
    usgsTopo: {
      type: 'raster',
      tiles: ['https://basemap.nationalmap.gov/arcgis/rest/services/USGSTopo/MapServer/tile/{z}/{y}/{x}'],
      tileSize: 256, maxzoom: 16,
      attribution: 'USGS The National Map'
    }
  },
  layers: [{ id: 'base', type: 'raster', source: 'usgsTopo' }]
};
for (const y of YEARS) {
  style.sources['fires' + y] = {
    type: 'vector',
    tiles: [`http://localhost:8080/wa${y}/{z}/{x}/{y}.mvt`],
    minzoom: 4, maxzoom: 13
  };
  style.layers.push(
    { id: `sev-fill-${y}`, type: 'fill', source: 'fires' + y, 'source-layer': 'severity',
      paint: {
        'fill-color': ['match', ['get', 'severity'],
          1, '#7fffd4', 2, '#ffffbe', 3, '#ff8c00', 4, '#e60000', 5, '#7fffd4',
          'rgba(0,0,0,0)'],
        'fill-opacity': ['match', ['get', 'severity'], 1, 0.25, 5, 0.25, 0.65]
      } },
    { id: `perim-line-${y}`, type: 'line', source: 'fires' + y, 'source-layer': 'perimeters',
      paint: { 'line-color': '#000', 'line-width': 1.5,
               ...(y === '2024' ? { 'line-dasharray': [2, 1.5] } : {}) } }
  );
}
const map = new maplibregl.Map({
  container: 'map',
  center: [parseFloat(q.get('lng') || -119.0), parseFloat(q.get('lat') || 47.9)],
  zoom: parseFloat(q.get('z') || 7),
  style
});
for (const y of YEARS) {
  document.getElementById('y' + y).addEventListener('change', e => {
    const vis = e.target.checked ? 'visible' : 'none';
    map.setLayoutProperty(`sev-fill-${y}`, 'visibility', vis);
    map.setLayoutProperty(`perim-line-${y}`, 'visibility', vis);
  });
  map.on('click', `perim-line-${y}`, e => {
    const p = e.features[0].properties;
    new maplibregl.Popup().setLngLat(e.lngLat)
      .setHTML(`<b>${p.incid_name}</b><br>${p.ig_date} — ${Math.round(p.burnbndac).toLocaleString()} ac<br>${p.asmnt_type} assessment`)
      .addTo(map);
  });
}
</script>
</body>
</html>
